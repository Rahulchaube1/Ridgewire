[package]
name = "ridgewire"
version = "0.2.0"
edition = "2021"
description = "Concurrent, read-only research CLI for web and platform data"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rahulchaube1/Ridgewire"

keywords = ["research", "cli", "agents", "search"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros","rt-multi-thread","time","process","io-util","fs"] }
tempfile = "3"
dirs = "6"
fs2 = "0.4"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
